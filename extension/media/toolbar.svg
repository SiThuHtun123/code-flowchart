<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Editor title-bar icon, in the same colours as the flowchart itself:
       green start, amber decision, blue actions. VS Code renders this at
       16px, so shapes are larger and connectors thinner than the 128px
       Marketplace icon — fine detail turns to mush at this size.

       Filled and coloured rather than a themed monochrome stroke: the button
       is the extension's only entry point, and colour is what makes it
       findable for someone who doesn't yet know it exists. -->

  <!-- connectors, drawn first so the shapes sit on top -->
  <g stroke="#8b95a8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3.6 v1.1"/>
    <path d="M4.4 8 H2.4 v2.3"/>
    <path d="M11.6 8 H13.6 v2.3"/>
  </g>

  <!-- start -->
  <rect x="5.4" y="0.6" width="5.2" height="3" rx="1.5"
        fill="#34d399" stroke="#059669" stroke-width="0.8"/>

  <!-- decision -->
  <path d="M8 4.7 L11.6 8 L8 11.3 L4.4 8 Z"
        fill="#fbbf24" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- two actions -->
  <rect x="0.5" y="10.6" width="3.9" height="3" rx="0.8"
        fill="#60a5fa" stroke="#2563eb" stroke-width="0.8"/>
  <rect x="11.6" y="10.6" width="3.9" height="3" rx="0.8"
        fill="#60a5fa" stroke="#2563eb" stroke-width="0.8"/>
</svg>
